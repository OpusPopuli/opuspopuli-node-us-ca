# Prometheus Alerting Rules for OPUSPOPULI
# @see https://github.com/OpusPopuli/opuspopuli/issues/308
#
# NOTE ON NOTIFICATION ROUTING:
# These rules are EVALUATED by Prometheus (they produce ALERTS-state series you
# can query and graph), but they are NOT routed to any notifier. There is
# intentionally no `alerting:` section in prometheus.yml and no Alertmanager
# container. The chosen platform direction is Grafana-managed alerting
# (bootstrap doc Phase 10), which is the actual notification path.
# These rules are kept because they remain useful as queryable series and as a
# reference for the equivalent Grafana-managed alert definitions.

groups:
  - name: opuspopuli-service-health
    rules:
      # Alert when a scrape target is unreachable for 2 minutes
      - alert: ServiceDown
        expr: up == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Service {{ $labels.job }} is down"
          description: "{{ $labels.job }} has been unreachable for more than 2 minutes."

      # Alert when HTTP error rate exceeds 5% over 5 minutes
      - alert: HighErrorRate
        expr: |
          (
            sum(rate(http_requests_total{status_code=~"5.."}[5m])) by (service)
            /
            sum(rate(http_requests_total[5m])) by (service)
          ) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High error rate on {{ $labels.service }}"
          description: "{{ $labels.service }} has >5% HTTP 5xx error rate (current: {{ $value | humanizePercentage }})."

  - name: opuspopuli-document-pipeline
    rules:
      # Alert when OCR failure rate spikes (>10% over 10 minutes)
      - alert: OcrFailureSpike
        expr: |
          (
            sum(rate(ocr_extractions_total{status="failure"}[10m])) by (service)
            /
            sum(rate(ocr_extractions_total[10m])) by (service)
          ) > 0.10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "OCR failure rate spiking on {{ $labels.service }}"
          description: "OCR failure rate >10% for 5 minutes (current: {{ $value | humanizePercentage }})."

      # Alert when scan failure rate exceeds 5%
      - alert: HighScanFailureRate
        expr: |
          (
            sum(rate(document_scans_total{status="failure"}[10m])) by (service)
            /
            sum(rate(document_scans_total[10m])) by (service)
          ) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High scan failure rate on {{ $labels.service }}"
          description: "Scan failure rate >5% for 5 minutes (current: {{ $value | humanizePercentage }})."

      # Alert when scan processing p95 latency exceeds 5 seconds
      - alert: HighScanLatency
        expr: |
          histogram_quantile(0.95,
            sum(rate(document_scan_duration_seconds_bucket[5m])) by (service, le)
          ) > 5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High scan latency on {{ $labels.service }}"
          description: "p95 scan processing latency >5s (current: {{ $value | humanizeDuration }})."

      # Alert when analysis failure rate exceeds 10%
      - alert: HighAnalysisFailureRate
        expr: |
          (
            sum(rate(document_analyses_total{status="failure"}[10m])) by (service)
            /
            sum(rate(document_analyses_total[10m])) by (service)
          ) > 0.10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High AI analysis failure rate on {{ $labels.service }}"
          description: "AI analysis failure rate >10% for 5 minutes (current: {{ $value | humanizePercentage }})."

  # Sync prunes — F2 (docs/plans/F2-bill-prune-scope.md).
  #
  # A prune hard-deletes, and a bill takes its votes, co-authors and
  # committee assignments with it, so this is the one pipeline outcome a
  # re-sync does not repair. The deletion guard caps ONE run at
  # max(2%, 10 bills); it cannot see a source that quietly drops 1.9% a day,
  # which stays under the cap every run and removes a session in a month.
  # The 7-day sum is what catches that.
  #
  # Every series these rules read is created at zero when the region service
  # boots (RegionSyncService.primePruneSeries). prom-client exports a labelled
  # counter only after its first increment, and increase() cannot see a
  # series born above zero — so without that, the first refusal or deletion
  # after a restart, usually the only one on a node that syncs by hand, would
  # never alert.
  - name: opuspopuli-sync-prune
    rules:
      - alert: SyncBulkDeletion
        expr: sum by (data_type) (increase(pipeline_rows_deleted_total[7d])) > 100
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.data_type }} sync pruned {{ $value | humanize }} rows in 7 days"
          description: >-
            More than 100 {{ $labels.data_type }} rows were deleted by sync
            prunes over the last week. Deletions cascade and a re-sync does
            not restore them. Check the discover phase for a source that is
            returning fewer links than it should before the next sync runs.

      - alert: SyncPruneRefused
        expr: sum by (data_type) (increase(pipeline_items_total{reason="deletion-guard"}[1d])) > 0
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.data_type }} prune refused by the deletion guard"
          description: >-
            A {{ $labels.data_type }} prune would have deleted more rows than
            its guard allows, so it deleted nothing. It will keep refusing on
            every sync until the cause is found — usually a discovery pass
            that lost a source. The ERROR line in region-worker logs names
            the first 20 rows it kept.

      # A prune that cannot run is not an error in the sync, so nothing else
      # reports it — and a source that returns nothing every run disables
      # pruning for good while each sync completes "successfully".
      - alert: SyncPruneDisabled
        expr: sum by (data_type, reason) (increase(pipeline_items_total{phase="prune_stale",reason=~"source-returned-nothing|unidentified-status-urls|no-covered-sessions"}[1d])) > 0
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.data_type }} prune skipped: {{ $labels.reason }}"
          description: >-
            A {{ $labels.data_type }} sync could not trust its discovery pass
            ({{ $labels.reason }}), so it pruned nothing. A source that
            returns nothing is also a source that ingested nothing; check the
            discover phase line in region-worker logs.

  # Child-job queues (propositions Phase B). Job metrics only see a job once
  # something picks it up, so a queue nobody consumes — a WORKER_QUEUES slip
  # on a multi-host node, or the consuming host down — is silent everywhere
  # else.
  # A pdf-parse requester waits 10 minutes before parsing in process, so a
  # stall here turns a sync into hours without failing it.
  - name: opuspopuli-queues
    rules:
      - alert: QueueBacklogStalled
        # Waiting AND nothing running: a busy lane at concurrency 1 holds
        # jobs for longer than this every sync night, and that is health,
        # not a stall.
        expr: >-
          (max by (queue) (bullmq_queue_oldest_waiting_seconds) > 600)
          and on (queue)
          (max by (queue) (bullmq_queue_jobs{state="active"}) == 0)
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.queue }}: oldest waiting job is {{ $value | humanizeDuration }} old"
          description: >-
            A job on {{ $labels.queue }} has waited over 10 minutes with
            nothing running on the queue: nothing consumes it. Check
            WORKER_QUEUES on every host, and that the consuming host is up.

  # Backup freshness — opuspopuli#1217.
  #
  # Production backups stopped on 2026-07-23 and nobody noticed for 49 days.
  # Nothing in the deploy path restarts the backup container (op-deploy
  # excludes docker-compose-backup.yml by design), so a node that is never
  # redeployed can go quiet indefinitely. These rules make that loud.
  #
  # Source: backup-db.sh / backup-prompts-db.sh write a Prometheus textfile
  # (.prom) on completion; node_exporter's textfile collector serves it.
  # If backups stop, the gauge stops advancing and BackupStale fires. If the
  # node or exporter dies, the series disappears and BackupMissing fires.
  # Both failure modes must alert — the 2026-07-23 outage was the first kind.
  - name: opuspopuli-backups
    rules:
      # Backups run daily (10:00 UTC main, 10:10 UTC prompts). 36h allows a
      # single missed window plus slack before paging, so one transient
      # failure does not wake anyone, but two consecutive ones do.
      - alert: BackupStale
        expr: time() - backup_last_success_timestamp_seconds > 129600
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "No successful backup of {{ $labels.database }} in over 36h"
          description: >-
            Last successful backup of {{ $labels.database }} was
            {{ $value | humanizeDuration }} ago (threshold 36h). Check the
            backup container: `docker ps --filter name=opuspopuli-backup`
            and /backups/backup.log. See docs/runbooks/restore-drill.md.

      # A silent stop also looks like an absent series — e.g. the backup
      # container was never started after a reboot, so it never wrote a
      # .prom file at all. `absent()` is what catches the 2026-07-23 shape.
      - alert: BackupMissing
        expr: absent(backup_last_success_timestamp_seconds)
        for: 30m
        labels:
          severity: critical
        annotations:
          summary: "Backup metrics absent — backups may not be running at all"
          description: >-
            No backup_last_success_timestamp_seconds series is being
            scraped. Either node_exporter's textfile collector is down or
            the backup job has never run on this node.

      # Distinct from staleness: the job ran and failed. Fires sooner
      # because a known failure needs no waiting period to be credible.
      - alert: BackupFailing
        expr: backup_last_status == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Last backup of {{ $labels.database }} failed"
          description: >-
            backup-db.sh exited non-zero. Inspect /backups/.backup.lasterr
            and backup.log. Staleness will escalate to critical at 36h.
